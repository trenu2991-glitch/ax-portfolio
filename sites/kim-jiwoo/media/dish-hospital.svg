<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="metalTray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="trayShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#334155" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#F8FAFC" rx="16"/>
  <!-- Stainless Meal Tray -->
  <rect x="40" y="30" width="520" height="340" rx="30" fill="url(#metalTray)" stroke="#94A3B8" stroke-width="4" filter="url(#trayShadow)"/>

  <!-- Top 3 compartments (Side dishes & Kimchi) -->
  <!-- Side 1: Andong Jjimdak (Braised Chicken) -->
  <rect x="70" y="55" width="135" height="110" rx="16" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
  <ellipse cx="137" cy="110" rx="45" ry="32" fill="#78350F" opacity="0.8"/>
  <circle cx="120" cy="100" r="14" fill="#B45309"/>
  <circle cx="150" cy="105" r="12" fill="#D97706"/>
  <rect x="130" y="115" width="18" height="6" rx="2" fill="#F59E0B"/>
  <text x="137" y="152" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="11" font-weight="700" fill="#1E293B">안동찜닭 (110g)</text>

  <!-- Side 2: Seafood Scallion Pancake -->
  <rect x="232" y="55" width="135" height="110" rx="16" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
  <ellipse cx="300" cy="110" rx="46" ry="30" fill="#CA8A04"/>
  <path d="M275 100 L325 115 M280 120 L320 100" stroke="#15803D" stroke-width="4" stroke-linecap="round"/>
  <circle cx="295" cy="108" r="6" fill="#EA580C"/>
  <circle cx="312" cy="114" r="5" fill="#EA580C"/>
  <text x="300" y="152" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="11" font-weight="700" fill="#1E293B">오징어 해물파전</text>

  <!-- Side 3: Baechu Kimchi -->
  <rect x="395" y="55" width="135" height="110" rx="16" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
  <ellipse cx="462" cy="110" rx="42" ry="28" fill="#DC2626" opacity="0.85"/>
  <path d="M440 98 Q462 120 480 105" stroke="#FEF08A" stroke-width="5" stroke-linecap="round" fill="none"/>
  <circle cx="450" cy="115" r="5" fill="#EF4444"/>
  <circle cx="475" cy="110" r="4" fill="#16A34A"/>
  <text x="462" y="152" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="11" font-weight="700" fill="#1E293B">포기김치 (적정숙성)</text>

  <!-- Bottom 2 compartments (Rice & Soup) -->
  <!-- Rice: Brown Rice & Oat -->
  <rect x="70" y="185" width="210" height="160" rx="20" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
  <ellipse cx="175" cy="265" rx="80" ry="60" fill="#FEF3C7"/>
  <circle cx="140" cy="245" r="5" fill="#D97706"/>
  <circle cx="165" cy="275" r="6" fill="#B45309"/>
  <circle cx="195" cy="240" r="5" fill="#D97706"/>
  <circle cx="210" cy="270" r="6" fill="#B45309"/>
  <circle cx="150" cy="285" r="5" fill="#D97706"/>
  <text x="175" y="325" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#1E293B">발아현미 귀리밥 (210g)</text>
  <text x="175" y="340" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="10" fill="#64748B">식이섬유 풍부 / 330 kcal</text>

  <!-- Soup: Beef Soybean Sprout Soup -->
  <rect x="320" y="185" width="210" height="160" rx="20" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
  <ellipse cx="425" cy="265" rx="80" ry="60" fill="#EA580C" opacity="0.6"/>
  <path d="M380 260 Q400 240 420 270" stroke="#FEF08A" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M430 250 Q450 280 470 260" stroke="#FEF08A" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="410" cy="275" r="9" fill="#991B1B"/>
  <circle cx="445" cy="255" r="8" fill="#991B1B"/>
  <circle cx="450" cy="285" r="6" fill="#22C55E"/>
  <text x="425" y="325" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="13" font-weight="700" fill="#1E293B">얼큰 소고기 콩나물국</text>
  <text x="425" y="340" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="10" fill="#64748B">염도 0.6% 관리 / 115 kcal</text>

  <!-- Spoon & Chopsticks detail -->
  <g opacity="0.65" transform="translate(545, 90)">
    <rect x="0" y="0" width="5" height="220" rx="2.5" fill="#94A3B8"/>
    <rect x="10" y="0" width="5" height="220" rx="2.5" fill="#94A3B8"/>
    <ellipse cx="2.5" cy="20" rx="10" ry="18" fill="#94A3B8"/>
  </g>
</svg>
