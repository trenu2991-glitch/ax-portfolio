<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6F4EA" />
      <stop offset="100%" stop-color="#C2E7D4" />
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2424" />
      <stop offset="100%" stop-color="#1B1414" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F2D20" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Circle with Soft Glow -->
  <circle cx="200" cy="200" r="185" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="185" fill="none" stroke="#34D399" stroke-width="4" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- Decorative Nutrition Elements in BG -->
  <g opacity="0.35">
    <circle cx="90" cy="110" r="14" fill="#10B981"/>
    <circle cx="310" cy="130" r="18" fill="#F59E0B"/>
    <path d="M70 280 Q 90 260 110 285 T 150 280" stroke="#059669" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M290 280 C 310 260, 330 300, 340 280" stroke="#10B981" stroke-width="3" fill="none"/>
  </g>

  <!-- Silhouette & Body (Doctor/Dietitian Coat) -->
  <g filter="url(#softShadow)">
    <!-- Inner Shirt / Collar (Sage Green) -->
    <path d="M165 240 L200 280 L235 240 L220 220 L180 220 Z" fill="#10B981" />
    <polygon points="200,280 192,230 208,230" fill="#047857" opacity="0.2"/>

    <!-- Dietitian White Coat -->
    <path d="M125 360 C 120 280, 138 235, 170 230 L 195 320 L 205 320 L 230 230 C 262 235, 280 280, 275 360 Z" fill="url(#coatGrad)" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- Lapels -->
    <path d="M170 230 L 200 295 L 180 370 L 125 365 C 130 310, 145 250, 170 230 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <path d="M230 230 L 200 295 L 220 370 L 275 365 C 270 310, 255 250, 230 230 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    
    <!-- Name Tag (Dietitian Kim Ji-woo) -->
    <rect x="225" y="270" width="42" height="22" rx="4" fill="#0F766E" />
    <rect x="227" y="272" width="38" height="6" rx="2" fill="#FFFFFF" opacity="0.85" />
    <rect x="227" y="281" width="22" height="4" rx="1.5" fill="#5EEAD4" />
    <rect x="227" y="287" width="14" height="2.5" rx="1" fill="#FFFFFF" opacity="0.7" />

    <!-- Pen in Pocket -->
    <rect x="145" y="275" width="24" height="28" rx="2" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
    <line x1="152" y1="265" x2="152" y2="280" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    <line x1="160" y1="267" x2="160" y2="280" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Neck -->
  <path d="M182 205 L182 238 C 182 248, 218 248, 218 238 L218 205 Z" fill="#FED7AA" />
  <ellipse cx="200" cy="236" rx="18" ry="6" fill="#FDBA74" opacity="0.4"/>

  <!-- Head Base -->
  <path d="M155 155 C 155 105, 245 105, 245 155 C 245 205, 200 226, 200 226 C 200 226, 155 205, 155 155 Z" fill="#FFEDD5" />

  <!-- Facial Features -->
  <!-- Cheeks Blush -->
  <ellipse cx="168" cy="178" rx="9" ry="5.5" fill="#FCA5A5" opacity="0.55" />
  <ellipse cx="232" cy="178" rx="9" ry="5.5" fill="#FCA5A5" opacity="0.55" />

  <!-- Eyes - Friendly, bright smile shape -->
  <path d="M166 162 C 171 157, 179 157, 184 162" stroke="#1F2937" stroke-width="3.2" stroke-linecap="round" fill="none" />
  <circle cx="175" cy="164" r="1.5" fill="#1F2937" />
  <path d="M216 162 C 221 157, 229 157, 234 162" stroke="#1F2937" stroke-width="3.2" stroke-linecap="round" fill="none" />
  <circle cx="225" cy="164" r="1.5" fill="#1F2937" />

  <!-- Eyebrows -->
  <path d="M165 150 C 171 146, 181 147, 185 152" stroke="#4A3B32" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M215 152 C 219 147, 229 146, 235 150" stroke="#4A3B32" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Nose -->
  <path d="M198 168 C 197 174, 200 176, 203 175" stroke="#FDBA74" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Warm Confident Smile -->
  <path d="M188 186 Q 200 198 212 186" stroke="#E11D48" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M189 187 Q 200 196 211 187 Z" fill="#FDA4AF" opacity="0.4" />

  <!-- Hair (Neat, tied professional hairstyle with soft bangs) -->
  <path d="M152 152 C 148 115, 170 85, 200 85 C 235 85, 252 115, 248 155 C 242 140, 244 125, 238 120 C 228 110, 215 110, 200 115 C 185 110, 170 112, 160 125 C 156 130, 154 142, 152 152 Z" fill="url(#hairGrad)" />
  <!-- Hair Bun / Pony in back -->
  <circle cx="200" cy="78" r="24" fill="url(#hairGrad)" />
  <ellipse cx="200" cy="85" rx="14" ry="7" fill="#10B981" /> <!-- Green scrunchie -->

  <!-- Soft Bangs Front -->
  <path d="M164 124 C 178 135, 188 122, 200 126 C 212 122, 222 135, 236 124 C 228 115, 214 114, 200 115 C 186 114, 172 115, 164 124 Z" fill="#2D2424" />

  <!-- Floating Badge: "RD / Clinical & Public Dietitian" -->
  <g transform="translate(48, 305)">
    <rect width="130" height="38" rx="19" fill="#FFFFFF" stroke="#10B981" stroke-width="2.5" filter="url(#softShadow)"/>
    <circle cx="22" cy="19" r="11" fill="#10B981"/>
    <path d="M17 19 L 20 22 L 27 15" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="39" y="17" font-family="'Pretendard', sans-serif" font-size="11" font-weight="bold" fill="#065F46">예비 영양사</text>
    <text x="39" y="29" font-family="'Pretendard', sans-serif" font-size="9.5" font-weight="600" fill="#047857">식품영양 4학년</text>
  </g>

  <g transform="translate(235, 60)">
    <rect width="125" height="36" rx="18" fill="#FFFFFF" stroke="#0D9488" stroke-width="2" filter="url(#softShadow)"/>
    <circle cx="20" cy="18" r="10" fill="#0D9488"/>
    <text x="16" y="22" font-family="'Pretendard', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">★</text>
    <text x="37" y="16" font-family="'Pretendard', sans-serif" font-size="10" font-weight="bold" fill="#0F766E">학점 4.2 / 4.5</text>
    <text x="37" y="28" font-family="'Pretendard', sans-serif" font-size="9" font-weight="500" fill="#64748B">전국 공모전 최우수상</text>
  </g>
</svg>
