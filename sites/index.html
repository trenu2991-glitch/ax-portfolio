<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AX 포트폴리오 특강 예시 사이트</title>
<style>
  :root { --fg: #1f2937; --muted: #4b5563; --bg: #ffffff; --card: #f3f4f6; --line: #e5e7eb; --accent: #1d4ed8; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f3f4f6; --muted: #cbd5e1; --bg: #111827; --card: #1f2937; --line: #374151; --accent: #93c5fd; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 48px 16px; font-family: system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 12px; text-align: center; }
  p { margin: 0 0 32px; color: var(--muted); text-align: center; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  a { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--fg); text-decoration: none; font-size: 1.1rem; font-weight: 600; }
  a:hover, a:focus-visible { border-color: var(--accent); color: var(--accent); }
  a span { color: var(--muted); font-weight: 400; }
</style>
</head>
<body>
<main>
<h1>AX 포트폴리오 특강 예시 사이트</h1>
<p>특강용 가상 인물 예시 모음입니다</p>
<ul>
  <li><a href="kim-jiwoo/">김지우 <span>→</span></a></li>
  <li><a href="park-dohyeon/">박도현 <span>→</span></a></li>
  <li><a href="lee-harin/">이하린 <span>→</span></a></li>
  <li><a href="jung-minjae/">정민재 <span>→</span></a></li>
  <li><a href="han-seoyoon/">한서윤 <span>→</span></a></li>
</ul>
</main>
</body>
</html>
